# Dependency updates. ci.yml merges Dependabot pull requests automatically once CI passes, except major updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates together (merged automatically when CI passes); majors arrive one per pull request.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node version in .nvmrc; bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned to the js-yaml Bubble Card ships; scripts/ts/upstream/vendorStoreParser.ts says when to move it.
      - dependency-name: "store-js-yaml"
    commit-message:
      prefix: "deps"
