name: CI

# Runs on every pull request, and before every release (release.yaml calls it).
# Everything the release depends on is checked here: formatting, script types, every test (module suites run against
# the source and the built module YAML), and the build itself.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, types, tests, build
    runs-on: ubuntu-latest
    concurrency:
      # A new push to a pull request cancels its previous run; release runs never cancel each other.
      group: ci-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check build scripts
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run all tests
        run: npm test

      - name: Build modules
        run: npm run build -- --skip-docs

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/

  dependabot-auto-merge:
    name: Merge Dependabot update
    # Merges a Dependabot pull request once the job above has passed on it, unless it is a major update (those need a
    # human: majors of Jest, jsdom or esbuild can change test or build behaviour). Merges made with this token don't
    # start other workflows, so no release runs; Dependabot never bumps a module version anyway.
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}

      - name: Leave major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major update (${{ steps.metadata.outputs.dependency-names }}) left for manual review."
