name: Release

# On every push to main: run CI, then publish a GitHub release for each module whose version in module.yaml has no
# release yet (tag `<module_id>/v<version>`). Bumping a module's version is the release signal; anything else is a
# no-op, so the workflow is safe to re-run. Release notes are that module's CHANGELOG entries since its last release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # ci.yml's Dependabot merge job (skipped here) declares write access; a called workflow may not ask for more than
    # its caller grants, even for a job that won't run.
    permissions:
      contents: write
      pull-requests: write

  release:
    name: Publish new module versions
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build modules
        run: npm run build -- --skip-docs

      - name: Plan releases
        run: |
          gh release list --limit 1000 --json tagName --jq '[.[].tagName]' > "$RUNNER_TEMP/published-tags.json"
          node --import tsx scripts/ts/release/writeReleasePlan.ts "$RUNNER_TEMP/published-tags.json" "$RUNNER_TEMP/releases"

      - name: Publish releases
        run: |
          jq -c '.[]' "$RUNNER_TEMP/releases/plan.json" | while read -r release; do
            tag=$(jq -r .tag <<<"$release")
            gh release create "$tag" "$(jq -r .asset <<<"$release")" \
              --title "$(jq -r .title <<<"$release")" \
              --notes-file "$(jq -r .notesFile <<<"$release")" \
              --target "$GITHUB_SHA"
            echo "::notice::Published $tag"
          done

  keep-stale-enabled:
    name: Keep the stale workflow enabled
    # GitHub disables scheduled workflows after 60 days without commits; each push to main turns it back on.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow enable stale.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
